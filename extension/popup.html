<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiveChess Analyzer</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <!-- Texts are filled in from src/locales by popup.ts (data-i18n = dictionary key). -->
    <header>
      <h1>LiveChess Analyzer</h1>
      <label class="switch"><input type="checkbox" id="enabled" /> <span data-i18n="popup.enabled"></span></label>
    </header>

    <section>
      <label class="check"><input type="checkbox" id="showArrow" /> <span data-i18n="popup.showArrow"></span></label>
      <label class="check"><input type="checkbox" id="showEvalBar" /> <span data-i18n="popup.showEvalBar"></span></label>
      <label class="check"><input type="checkbox" id="showPanel" /> <span data-i18n="popup.showPanel"></span></label>
      <label class="check"><input type="checkbox" id="showOpening" /> <span data-i18n="popup.showOpening"></span></label>
      <label class="check"><input type="checkbox" id="onlyMyTurn" /> <span data-i18n="popup.onlyMyTurn"></span></label>
    </section>

    <section>
      <label class="select"><span data-i18n="popup.multiPv"></span>
        <select id="multiPv">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="range"><span data-i18n="popup.depth"></span> <output id="depthOut"></output><input type="range" id="depth" /></label>
      <label class="range"><span data-i18n="popup.threads"></span> <output id="threadsOut"></output><input type="range" id="threads" /></label>
      <label class="range"><span data-i18n="popup.hash"></span> <output id="hashMbOut"></output><input type="range" id="hashMb" min="16" max="256" step="16" /></label>
    </section>

    <section>
      <label class="select"><span data-i18n="popup.language"></span>
        <select id="locale">
          <option value="auto" data-i18n="lang.auto"></option>
          <option value="en" data-i18n="lang.en"></option>
          <option value="ru" data-i18n="lang.ru"></option>
        </select>
      </label>
      <label class="select"><span data-i18n="popup.font"></span> <select id="fontFamily"></select></label>
      <label class="select"><span data-i18n="popup.textSize"></span>
        <select id="fontScale">
          <option value="90" data-i18n="popup.sizeSmall"></option>
          <option value="100" data-i18n="popup.sizeNormal"></option>
          <option value="115" data-i18n="popup.sizeLarge"></option>
          <option value="130" data-i18n="popup.sizeXLarge"></option>
        </select>
      </label>
      <p class="font-preview" id="fontPreview">Nf3 +0.27 · Nimzo-Indian Defense, E20</p>
    </section>

    <section>
      <button id="openTrainer" class="trainer-btn" data-i18n="popup.openTrainer"></button>
    </section>

    <footer data-i18n="popup.footer"></footer>
    <p class="support-row">
      <a id="support" class="support-link" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">❤️</span> <span data-i18n="support.project"></span></a>
    </p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
